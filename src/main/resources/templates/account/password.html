<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password · ClassVoice</title>
  <link rel="stylesheet" th:href="@{/css/classvoice.css}">
</head>
<body>
  <main class="card">
    <img class="logo" th:if="${logoUrl}" th:src="@{${logoUrl}}" alt="">
    <div class="brand" th:text="${collegeName}">College</div>
    <h1>Change password</h1>
    <p><a th:href="@{${homeUrl}}">Back to dashboard</a></p>
    <p class="muted">After a successful change you are signed out and must sign in again.</p>

    <form th:action="@{/account/password}" th:object="${form}" method="post" autocomplete="off">
      <label for="currentPassword">Current password</label>
      <input id="currentPassword" th:field="*{currentPassword}" type="password" autocomplete="current-password">
      <div class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>

      <label for="newPassword">New password (min 10 characters)</label>
      <input id="newPassword" th:field="*{newPassword}" type="password" autocomplete="new-password">
      <div class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>

      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" th:field="*{confirmPassword}" type="password" autocomplete="new-password">
      <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>

      <button type="submit">Change password</button>
    </form>
  </main>
</body>
</html>
